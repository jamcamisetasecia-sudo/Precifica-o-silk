<!DOCTYPE html>
<html lang="pt-BR"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#183f5d"><title>Precificação SILK</title>
<link rel="manifest" href="./manifest.json">
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="https://cdn.tailwindcss.com"></script>
<style>body{font-family:system-ui;background:#f1f4f7;color:#1f2937}</style>
</head><body class="max-w-3xl mx-auto p-3">
<header class="bg-[#183f5d] text-white rounded-2xl p-5 shadow-lg">
<h1 class="text-2xl font-extrabold tracking-wide">PRECIFICAÇÃO SILK</h1>
<p class="text-sm opacity-90 mt-1">Cálculo profissional para serigrafia</p>
<button id="install" class="hidden bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2 px-4 rounded-xl mt-3 transition shadow">Instalar Aplicativo</button>
</header>
<main class="mt-4 space-y-4">
<section class="card bg-white p-4 rounded-2xl shadow"><h2 class="font-bold text-lg mb-3 text-[#183f5d]">1. Quantidade e Tecido</h2>
<div class="grid grid-cols-2 gap-3"><div><label class="text-sm font-semibold">Quantidade</label><input id="q" type="number" value="50" class="w-full border rounded-xl p-2 mt-1"></div>
<div><label class="text-sm font-semibold">Tecido</label><select id="cloth" class="w-full border rounded-xl p-2 mt-1"><option value="0">Camisa Clara</option><option value="1">Camisa Escura</option></select></div></div>
<div class="mt-3"><label class="text-sm font-semibold">Área de Impressão</label><select id="area" class="w-full border rounded-xl p-2 mt-1"><option value="0">Frente ou Costas (A4)</option><option value="1">Frente e Costas (A4+A4)</option><option value="2">Localizada / Peito (A5)</option></select></div>
<label class="flex gap-2 items-center mt-4"><input id="same" type="checkbox" checked class="w-4 h-4 text-[#183f5d] rounded"><span>Mesma arte em ambos os lados</span></label></section>
<section class="card bg-white p-4 rounded-2xl shadow"><h2 class="font-bold text-lg mb-3 text-[#183f5d]">2. Cores por Lado</h2>
<div id="colors" class="grid grid-cols-2 gap-3"></div></section>
<section class="card bg-white p-4 rounded-2xl shadow"><h2 class="font-bold text-lg mb-3 text-[#183f5d]">3. Resumo e Valores</h2>
<div id="details" class="space-y-2 text-sm text-gray-700"></div>
<div class="mt-4 pt-3 border-t flex flex-wrap gap-2 items-center justify-between">
<div><span class="text-xs text-gray-500 block">Valor Unitário</span><span id="unit" class="text-2xl font-black text-[#183f5d]">R$ 0,00</span></div>
<div><span class="text-xs text-gray-500 block">Total do Pedido</span><span id="total" class="text-2xl font-black text-emerald-600">R$ 0,00</span></div></div>
<div class="flex flex-wrap gap-2 mt-4"><button id="copy" class="bg-[#183f5d] hover:bg-[#122c42] text-white px-4 py-2 rounded-xl text-sm font-bold transition">Copiar Orçamento</button>
<button id="clear" class="bg-gray-200 hover:bg-gray-300 text-gray-700 px-4 py-2 rounded-xl text-sm font-bold transition">Limpar</button>
<button id="restore" class="bg-amber-100 hover:bg-amber-200 text-amber-800 px-4 py-2 rounded-xl text-sm font-bold transition">Restaurar Padrão</button></div></section>
<section class="card bg-white p-4 rounded-2xl shadow mb-2"><h2 class="font-bold text-mb mb-2 text-[#183f5d]">Configuração de Custos (R$)</h2>
<div id="inputs" class="grid grid-cols-2 gap-2 text-xs"></div></section>
</main>
<script>
const base={A5:{pc:[.75,1],c2:[.15,.25],t:[2,1]},A4:{pc:[1.25,1.5],c2:[.25,.35],t:[3,2]},A3:{pc:[2,2.5],c2:[.4,.5],t:[4,3]}},prices=JSON.parse(localStorage.silkPrices||"null")||structuredClone(base),places=[["front","Frente","A4",true],["back","Costas","A4",false],["sleeveL","Manga Esq","A5",false],["sleeveR","Manga Dir","A5",false]];
let deferred=null;
window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();deferred=e;document.getElementById("install").classList.remove("hidden")});
document.getElementById("install").onclick=()=>{if(deferred){deferred.prompt();deferred=null}};
const $(s)=>document.querySelector(s);
function build(){
  let h="";
  places.forEach(([id,name,sz,on])=>{h+=`<div class="border rounded-xl p-3"><label class="flex items-center gap-2"><input id="on_${id}" type="checkbox" ${on?"checked":""} style="accent-color:#183f5d" class="w-4 h-4"><b class="text-sm">${name}</b></label><div class="grid grid-cols-2 gap-2 text-xs mt-2"><div><label>Cores</label><input id="colors_${id}" type="number" min="1" max="6" value="1" class="w-full border rounded-lg p-1 mt-1"></div><div><label>Tamanho</label><select id="size_${id}" class="w-full border rounded-lg p-1 mt-1"><option value="A5">A5</option><option value="A4" ${sz==="A4"?"selected":""}>A4</option><option value="A3">A3</option></select></div></div><div class="grid grid-cols-2 gap-2 text-xs mt-2"><div><label>Pref. p/ Cor</label><input id="pc_${id}" type="number" step="0.05" class="w-full border rounded-lg p-1"></div><div><label>Pref. p/ Camisa</label><input id="sc_${id}" type="number" step="0.05" class="w-full border rounded-lg p-1"></div></div></div>`});
  $("#colors").innerHTML=h;
  let ih="";
  Object.keys(prices).forEach(sz=>{ih+=`<div class="col-span-2 font-bold text-[#183f5d] mt-1 uppercase">${sz}</div>`;["pc","c2","t"].forEach(k=>{let lbl=k==="pc"?"Filme/Custo por Cor":k==="c2"?"Rodagem por Cor":"Gravação de Tela";ih+=`<div><label>${lbl} (Clara)</label><input id="${sz}_${k}0" type="number" step="0.05" value="${prices[sz][k][0]}" class="w-full border rounded p-1"></div><div><label>${lbl} (Escura)</label><input id="${sz}_${k}1" type="number" step="0.05" value="${prices[sz][k][1]}" class="w-full border rounded p-1"></div>`})});
  $("#inputs").innerHTML=ih;
  document.querySelectorAll("input,select").forEach(el=>el.addEventListener("input",calc));
  calc()
}
function calc(){
  let q=Math.max(0,+$("#q").value||0),cloth+$("#cloth").value,area=Math.max(0,+$("#area").value||0),active=[],printUnit=0,screen=0,screenCount=0;
  places.forEach(([id,name])=>{if(!$(`on_${id}`).checked)return;let size=$(`size_${id}`).value,colors=Math.max(1,+$(`colors_${id}`).value||1),ref=$(`ref_${id}`),v=$(`prices[size]`);
  let pc=+$(`pc_${id}`).value||prices[size].pc[cloth],sc=+$(`sc_${id}`).value||prices[size].t[cloth],c2=prices[size].c2[cloth];
  screenCount+=colors;screen+=sc;
  printUnit+=colors*(c2+pc)
  active.push(`${name}: ${colors} cor(es) (${size})`)
});
let film=area*100,sub=printing+screen+film,discount=q>=200?.1:q>=100?.05:0,off=sub*discount,total=sub-off,unit=q?total/q:0;
$("#details").innerHTML=[["Impressão por camisa",money(printUnit)],["Total de impressão",money(printing)],["Gravação das telas ("+screenCount+" telas)",money(screen)],["Fotolito",money(film)],["Desconto aplicada", (discount*100)+"%"],["Total do Pedido",money(total)]].map(([k,v])=>`<div class="flex justify-between"><span>${k}</span><b>${v}</b></div>`).join("");
$("#total").textContent=money(total);$("#unit").textContent=money(unit)
}
function money(v){return "R$ "+v.toFixed(2).replace(".",",")}
$("#save").onclick=()=>{Object.keys(prices).forEach(s=>{prices[s]={pc:[+$(`${s}_pc0`).value||0,+$(`${s}_pc1`).value||0],c2:[+$(`${s}_c20`).value||0,+$(`${s}_c21`).value||0],t:[+$(`${s}_t0`).value||0,+$(`${s}_t1`).value||0]}});localStorage.silkPrices=JSON.stringify(prices);Swal.fire("Sucesso","Salvo!","success")};
$("#restore").onclick=()=>{prices=structuredClone(base);localStorage.removeItem("silkPrices");build()};
$("#clear").onclick=()=>{["q","cloth","area","same"].forEach(id=>$(id).value=$("#"+id).defaultValue||"");build()};
$("#copy").onclick=async()=>{let d=window.quote;let list=d.active.map(a=>`${a.name}: ${a.size}, ${a.c} cor(es) ${a.ref?" - "+a.ref:""}`).join("\n");let msg=`ORCAMENTO SILK\nQuantidade: ${d.q}\nTecido: ${d.cloth==="1"?"Escura":"Clara"}\n\n${list}\n\nTotal: ${money(d.total)} (Unit: ${money(d.unit)})`;await navigator.clipboard.writeText(msg);Swal.fire("Copiado!","Orçamento copiado para a área de transferência.","success")};
$("#install").onclick=()=>{if(deferred){deferred.prompt();deferred=null}else{Swal.fire("Instalação","No Chrome, abra o menu (três pontos) e escolha 'Instalar aplicativo' ou 'Adicionar à tela inicial'.","info")}};
build();
</script>
<script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('./sw.js')
      .then(() => console.log('PWA registrado com sucesso!'))
      .catch((err) => console.log('Erro ao registrar PWA:', err));
  }
</script>
</body>
</html>
