<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#183f5d">
<title>Precificação SILK</title>
<link rel="manifest" href="./manifest.json">
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="https://cdn.tailwindcss.com"></script>
<style>body{font-family:system-ui;background:#f1f4f7;color:#1f2937}</style>
</head>
<body class="max-w-3xl mx-auto p-3">
<header class="bg-[#183f5d] text-white rounded-2xl p-5 shadow-lg">
  <h1 class="text-2xl font-extrabold tracking-wide">PRECIFICAÇÃO SILK</h1>
  <p class="text-sm opacity-90 mt-1">Cálculo profissional para serigrafia</p>
  <button id="install" class="hidden bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2 px-4 rounded-xl mt-3 transition shadow">Instalar Aplicativo</button>
</header>

<main class="mt-4 space-y-4">
  <section class="card bg-white p-4 rounded-2xl shadow">
    <h2 class="font-bold text-lg mb-3 text-[#183f5d]">1. Quantidade e Tecido</h2>
    <div class="grid grid-cols-2 gap-3">
      <div><label class="text-sm font-semibold">Quantidade</label><input id="q" type="number" value="50" class="w-full border rounded-xl p-2 mt-1"></div>
      <div><label class="text-sm font-semibold">Tecido</label><select id="cloth" class="w-full border rounded-xl p-2 mt-1"><option value="0">Camisa Clara</option><option value="1">Camisa Escura</option></select></div>
    </div>
    <div class="mt-3"><label class="text-sm font-semibold">Área de Impressão</label><select id="area" class="w-full border rounded-xl p-2 mt-1"><option value="0">Frente ou Costas (A4)</option><option value="1">Frente e Costas (A4+A4)</option><option value="2">Localizada / Peito (A5)</option></select></div>
    <label class="flex gap-2 items-center mt-4"><input id="same" type="checkbox" checked class="w-4 h-4 text-[#183f5d] rounded"><span>Mesma arte em ambos os lados</span></label>
  </section>

  <section class="card bg-white p-4 rounded-2xl shadow">
    <h2 class="font-bold text-lg mb-3 text-[#183f5d]">2. Cores por Lado</h2>
    <div id="colors" class="grid grid-cols-2 gap-3"></div>
  </section>

  <section class="card bg-white p-4 rounded-2xl shadow">
    <h2 class="font-bold text-lg mb-3 text-[#183f5d]">3. Resumo e Valores</h2>
    <div id="details" class="space-y-2 text-sm text-gray-700"></div>
    <div class="mt-4 pt-3 border-t flex flex-wrap gap-2 items-center justify-between">
      <div><span class="text-xs text-gray-500 block">Valor Unitário</span><span id="unit" class="text-2xl font-black text-[#183f5d]">R$ 0,00</span></div>
      <div><span class="text-xs text-gray-500 block">Total do Pedido</span><span id="total" class="text-2xl font-black text-emerald-600">R$ 0,00</span></div>
    </div>
    <div class="flex flex-wrap gap-2 mt-4">
      <button id="copy" class="bg-[#183f5d] hover:bg-[#122c42] text-white px-4 py-2 rounded-xl text-sm font-bold transition">Copiar Orçamento</button>
      <button id="clear" class="bg-gray-200 hover:bg-gray-300 text-gray-700 px-4 py-2 rounded-xl text-sm font-bold transition">Limpar</button>
      <button id="restore" class="bg-amber-100 hover:bg-amber-200 text-amber-800 px-4 py-2 rounded-xl text-sm font-bold transition">Restaurar Padrão</button>
    </div>
  </section>

  <section class="card bg-white p-4 rounded-2xl shadow mb-2">
    <h2 class="font-bold text-mb mb-2 text-[#183f5d]">Configuração de Custos (R$)</h2>
    <div id="inputs" class="grid grid-cols-2 gap-2 text-xs"></div>
  </section>
</main>

<script>
const base = { A5: { pc: [0.75, 1], c2: [0.15, 0.25], t: [2, 1] }, A4: { pc: [1.25, 1.5], c2: [0.25, 0.35], t: [3, 2] }, A3: { pc: [2, 2.5], c2: [0.4, 0.5], t: [4, 3] } };
let prices = JSON.parse(localStorage.silkPrices || "null") || structuredClone(base);
const places = [["front", "Frente", "A4", true], ["back", "Costas", "A4", false], ["sleeveL", "Manga Esq", "A5", false], ["sleeveR", "Manga Dir", "A5", false]];

let deferredPrompt = null;
window.addEventListener("beforeinstallprompt", (e) => {
  e.preventDefault();
  deferredPrompt = e;
  document.getElementById("install").classList.remove("hidden");
});

const $ = (s) => document.querySelector(s);

function build() {
  let h = "";
  places.forEach(([id, name, sz, on]) => {
    h += <div class="border rounded-xl p-3"><label class="flex items-center gap-2"><input id="on_${id}" type="checkbox" ${on ? "checked" : ""} class="w-4 h-4"><b class="text-sm">${name}</b></label><div class="grid grid-cols-2 gap-2 text-xs mt-2"><div><label>Cores</label><input id="colors_${id}" type="number" min="1" max="6" value="1" class="w-full border rounded-lg p-1 mt-1"></div><div><label>Tamanho</label><select id="size_${id}" class="w-full border rounded-lg p-1 mt-1"><option value="A5">A5</option><option value="A4" ${sz === "A4" ? "selected" : ""}>A4</option><option value="A3">A3</option></select></div></div></div>;
  });
  $("#colors").innerHTML = h;
  document.querySelectorAll("input,select").forEach(el => el.addEventListener("input", calc));
  calc();
}

function calc() {
  let q = Math.max(0, +$("#q").value || 0);
  let cloth = +$("#cloth").value;
  let area = Math.max(0, +$("#area").value || 0);
  let printUnit = 0, screen = 0, screenCount = 0;

  places.forEach(([id]) => {
    let el = $(#on_${id});
    if (el && el.checked) {
      let size = $(#size_${id}).value;
      let colors = Math.max(1, +$(#colors_${id}).value || 1);
      screenCount += colors;
      screen += prices[size].t[cloth];
      printUnit += colors * (prices[size].c2[cloth] + prices[size].pc[cloth]);
    }
  });

  let printing = printUnit * q;
  let film = area * 100;
  let sub = printing + screen + film;
  let discount = q >= 200 ? 0.1 : q >= 100 ? 0.05 : 0;
  let total = sub - (sub * discount);
  let unit = q ? total / q : 0;

  $("#details").innerHTML = [
    ["Impressão por camisa", money(printUnit)],
    ["Total de impressão", money(printing)],
    ["Gravação das telas (" + screenCount + " telas)", money(screen)],
    ["Desconto", (discount * 100) + "%"],
    ["Total do Pedido", money(total)]
  ].map(([k, v]) => <div class="flex justify-between"><span>${k}</span><b>${v}</b></div>).join("");

  $("#total").textContent = money(total);
  $("#unit").textContent = money(unit);
}

function money(v) { return "R$ " + v.toFixed(2).replace(".", ","); }

$("#install").onclick = () => {
  if (deferredPrompt) {
    deferredPrompt.prompt();
    deferredPrompt = null;
  } else {
    Swal.fire("Instalação", "No Chrome do seu celular, abra o menu de 3 pontos no canto superior direito e selecione 'Adicionar à tela inicial' ou 'Instalar aplicativo'.", "info");
  }
};

build();

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./sw.js')
    .then(() => console.log('PWA OK'))
    .catch((err) => console.log('Erro PWA:', err));
}
</script>
</body>
</html>
